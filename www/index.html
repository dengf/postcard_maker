  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Postcard Maker",
    "url": "https://dengf.github.io/postcard_maker/",
    "applicationCategory": "PhotoApplication",
    "operatingSystem": "Any",
    "description": "Crop a photo to a postcard template, apply a filter, add a greeting message and stickers, then email or save the finished postcard. All image processing runs client-side in WebAssembly.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "Take a photo or choose one from your device",
      "Postcard crop templates (landscape, square, portrait)",
      "Photo filters: grayscale, sepia, vintage",
      "Greeting message in English, Simplified or Traditional Chinese",
      "Decorative stickers",
      "Share directly to Mail/Messages, or save the image"
    ]
  }
  </script>
  <script>
    // Stamps `data-theme` on <html> from the stored preference (theme.js's
    // `applyTheme`, same key) before this document's own <style> below or
    // main.css ever paint anything -- React doesn't mount until after an
    // async WASM load (see src/index.js), so waiting for its effect to do
    // this would flash the wrong theme on the loading screen for however
    // long that takes. Duplicated here rather than imported because it has
    // to run synchronously, inline, before first paint; theme.js's copy is
    // what every later change (the picker in Header) uses instead.
    (function () {
      var t = null;
      try {
        t = localStorage.getItem('pc:theme');
      } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var isLight = t === 'light' || (t !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', isLight ? '#f8f6f5' : '#0f1720');
    })();
  </script>
  <style>
    /* The loading screen paints before main.css resolves, so it carries its
       own copy of the three-tier theme rule -- dark by default, light when
       the OS says so and nothing overrides it, light when explicitly
       chosen. Without the light halves, someone on a light device got a
       dark flash for the length of the wasm load. */
    html { color-scheme: dark; }
    html, body { background-color: #0f1720; }
    body { margin: 0; padding: 0; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #root { min-height: 100vh; }
    .loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 1.2rem; color: #d1436a; }
    @media (prefers-color-scheme: light) {
      html:not([data-theme='dark']) { color-scheme: light; }
      html:not([data-theme='dark']), html:not([data-theme='dark']) body { background-color: #f8f6f5; }
      html:not([data-theme='dark']) body { color: #241a1e; }
      html:not([data-theme='dark']) .loading { color: #b01243; }
    }
    html[data-theme='light'] { color-scheme: light; }
    html[data-theme='light'], html[data-theme='light'] body { background-color: #f8f6f5; }
    html[data-theme='light'] body { color: #241a1e; }
    html[data-theme='light'] .loading { color: #b01243; }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Loading&hellip;</div></div>
</body>
</html>
