name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  licenses:
    name: third-party attribution is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: licenses

      - name: Install cargo-about
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-about

      # `www/static/third-party-licenses.html` is a shipped, user-facing
      # page linked from the privacy policy, and it is the only place the
      # MIT/Apache-2.0/BSD notices for every crate compiled into the wasm
      # actually reach anyone — a `.wasm` is a binary distribution of every
      # crate inside it, and those licenses all condition binary
      # redistribution on the notice travelling along. Regenerating and
      # diffing here is what stops the page drifting: a new dependency now
      # fails CI until its notice is committed alongside it. The generator
      # is deterministic (verified by generating twice and diffing), so
      # this gate does not flake.
      #
      # This does NOT cover the two ONNX models — they are not Cargo
      # dependencies, so `cargo about` cannot see them. Their notices are
      # hand-maintained in MODEL-LICENSES.md and in about.hbs's own
      # "Machine-learning models" section (which this job does render, so a
      # botched edit to that section still fails here).
      - name: cargo about generate
        run: cargo about generate about.hbs -o www/static/third-party-licenses.html

      - name: fail if the committed page is out of date
        run: |
          if ! git diff --quiet -- www/static/third-party-licenses.html; then
            echo "::error::www/static/third-party-licenses.html is stale."
            echo "A dependency changed without its licence notice being regenerated."
            echo "Run: cargo about generate about.hbs -o www/static/third-party-licenses.html"
            git diff --stat -- www/static/third-party-licenses.html
            exit 1
          fi
          echo "Attribution page is current."

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

  wasm32:
    name: cargo build --target wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: wasm32

      # cargo check/test on the host never proves the wasm target compiles
      # -- postcard-wasm depends on `image`, which has real
      # platform-specific code paths. See CLAUDE.md.
      - name: cargo build -p postcard-wasm --target wasm32-unknown-unknown
        run: cargo build -p postcard-wasm --target wasm32-unknown-unknown

      # A green build of one crate proves nothing about the other -- each
      # is its own independent wasm-pack build with its own rten-based
      # dependency graph.
      - name: cargo build -p postcard-wasm-vibe --target wasm32-unknown-unknown
        run: cargo build -p postcard-wasm-vibe --target wasm32-unknown-unknown --release

  coverage:
    name: cargo llvm-cov (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-llvm-cov

      # Re-measured at 73.80% *lines* after adding "Suggest a look" (the
      # summary table's third triplet, not the first -- see
      # budget_planner's CI comment for the mistake this avoids
      # repeating). Was 79.59% before that round; the drop is the new
      # postcard-wasm-vibe bindings and postcard-wasm/collage.rs, which
      # join the existing wasm-binding modules (convert.rs, dto.rs,
      # photo.rs, template.rs, lib.rs) at 0% -- they take a JsValue/&[u8],
      # which native `cargo test` cannot construct, so they're exercised
      # by the browser instead, not this gate. `postcard-calc::vibe`'s own
      # `run_inference` (needs a real model file and `rten`) is the same
      # story. Recalibrate this number after a round that adds real
      # wasm-boundary code; don't chase it back up with contrived tests
      # for functions that only make sense called from JS.
      - name: cargo llvm-cov --fail-under-lines
        run: cargo llvm-cov --workspace --fail-under-lines 70

  www-test:
    name: www/ (React) unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - run: npm ci
        working-directory: www

      - run: npm test
        working-directory: www

  www-build:
    name: www/ (React + wasm) production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: www-build

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - run: npm ci
        working-directory: www

      - run: npm run deploy
        working-directory: www
