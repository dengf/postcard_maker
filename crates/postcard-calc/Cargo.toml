[package]
name = "postcard-calc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
postcard-core.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rten = { version = "0.25", optional = true }
rten-tensor = { version = "0.25", optional = true }

[features]
# Gated: rten is a full ML tensor runtime, most of its own crate's wasm
# payload -- see postcard-wasm-vibe's own doc comment for the measured
# size split this buys, mirroring budget_planner's identical `ocr`
# feature on budget-calc.
vibe = ["dep:rten", "dep:rten-tensor"]

[dev-dependencies]
